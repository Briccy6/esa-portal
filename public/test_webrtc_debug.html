<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>WebRTC Debug Test</h1>
    <button onclick="testPeerConnection()">Test Peer Connection</button>
    <button onclick="testSDPParsing()">Test SDP Parsing</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        const ICE_SERVERS = { iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ]};

        function log(message, type = 'log') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logs.appendChild(div);
            div.scrollIntoView();
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testPeerConnection() {
            log('Testing Peer Connection creation...');
            try {
                const pc = new RTCPeerConnection(ICE_SERVERS);
                log('✅ Peer connection created successfully', 'success');
                
                // Test creating an offer
                log('Testing offer creation...');
                pc.addTransceiver('video', { direction: 'sendrecv' });
                pc.addTransceiver('audio', { direction: 'sendrecv' });
                
                const offer = await pc.createOffer();
                log('✅ Offer created successfully', 'success');
                log(`Offer SDP length: ${offer.sdp.length} characters`);
                log(`Offer SDP preview: ${offer.sdp.substring(0, 200)}...`);
                
                // Test setting remote description
                log('Testing remote description setting...');
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                log('✅ Remote description set successfully', 'success');
                
                // Test creating answer
                log('Testing answer creation...');
                const answer = await pc.createAnswer();
                log('✅ Answer created successfully', 'success');
                
                // Test setting local description
                log('Testing local description setting...');
                await pc.setLocalDescription(answer);
                log('✅ Local description set successfully', 'success');
                
                pc.close();
                log('✅ All WebRTC operations completed successfully!', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.name} - ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        async function testSDPParsing() {
            log('Testing SDP parsing with sample offer...');
            
            // Sample SDP similar to what the teacher sends
            const sampleSDP = `v=0
o=- 3271171961244085207 2 IN IP4 127.0.0.1
s=-
t=0 0
a=group:BUNDLE 0 1
a=extmap-allow-mixed
a=msid-semantic: WMS
m=video 9 UDP/TLS/RTP/SAVPF 96 97 103 104 107 108 109 114 115 116 117 118 39 40 45 46 98 99 100 101 119 120 49 50 123 124 125
c=IN IP4 0.0.0.0
a=rtcp:9 IN IP4 0.0.0.0
a=ice-ufrag:Pidh
a=ice-pwd:4f3lbXziT3b4svXAWhi1fTgB
a=ice-options:trickle
a=fingerprint:sha-256 E5:EA:B4:E7:11:B5:75:90:F1:23:32:23:33:1C:F6:0F:D0:CA:06:66:1B:23:9A:46:52:ED:7B:A8:DF:1B:E5:BA
a=setup:actpass
a=mid:0
a=sendrecv
a=rtcp-mux
a=rtpmap:96 VP8/90000
a=rtcp-fb:96 goog-remb
m=audio 9 UDP/TLS/RTP/SAVPF 111 63 9 0 8 13 110 126
c=IN IP4 0.0.0.0
a=rtcp:9 IN IP4 0.0.0.0
a=ice-ufrag:Pidh
a=ice-pwd:4f3lbXziT3b4svXAWhi1fTgB
a=setup:actpass
a=mid:1
a=sendrecv
a=rtcp-mux
a=rtpmap:111 opus/48000/2`;

            try {
                const pc = new RTCPeerConnection(ICE_SERVERS);
                
                log('Testing setRemoteDescription with sample SDP...');
                await pc.setRemoteDescription(new RTCSessionDescription({ 
                    type: 'offer', 
                    sdp: sampleSDP 
                }));
                log('✅ Sample SDP parsed successfully', 'success');
                
                log('Testing createAnswer...');
                const answer = await pc.createAnswer();
                log('✅ Answer created from sample SDP', 'success');
                
                pc.close();
                log('✅ SDP parsing test completed successfully', 'success');
                
            } catch (error) {
                log(`❌ SDP Parsing Error: ${error.name} - ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        // Check browser support
        log('Browser WebRTC Support Check:');
        log(`RTCPeerConnection supported: ${typeof RTCPeerConnection !== 'undefined'}`);
        log(`RTCSessionDescription supported: ${typeof RTCSessionDescription !== 'undefined'}`);
        log(`RTCIceCandidate supported: ${typeof RTCIceCandidate !== 'undefined'}`);
        log(`getUserMedia supported: ${typeof navigator.mediaDevices !== 'undefined' && typeof navigator.mediaDevices.getUserMedia !== 'undefined'}`);
        
    </script>
</body>
</html>
