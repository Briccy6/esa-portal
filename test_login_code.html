<!DOCTYPE html>
<html>
<head>
    <title>Test Student Login Code</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007cba; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Test Student Login Code System</h2>
        
        <div class="form-group">
            <label for="regNumber">Registration Number:</label>
            <input type="text" id="regNumber" placeholder="Enter registration number">
        </div>
        
        <button onclick="sendCode()">Send Verification Code</button>
        <button onclick="testLogin()">Test Login with Code</button>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        function showResult(message, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
            resultDiv.innerHTML = message;
        }

        async function sendCode() {
            const regNumber = document.getElementById('regNumber').value;
            if (!regNumber) {
                showResult('Please enter a registration number', false);
                return;
            }

            try {
                const response = await fetch('/students/send-verification-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                    },
                    body: JSON.stringify({ reg_number: regNumber })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult('Code sent successfully! Debug info: ' + JSON.stringify(data, null, 2), true);
                } else {
                    showResult('Error: ' + data.message, false);
                }
            } catch (error) {
                showResult('Network error: ' + error.message, false);
            }
        }

        async function testLogin() {
            const regNumber = document.getElementById('regNumber').value;
            const code = prompt('Enter verification code:');
            
            if (!regNumber || !code) {
                showResult('Please enter both registration number and code', false);
                return;
            }

            try {
                const formData = new FormData();
                formData.append('reg_number', regNumber);
                formData.append('code', code);
                formData.append('_token', document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '');

                const response = await fetch('/student/login/code', {
                    method: 'POST',
                    body: formData
                });

                if (response.redirected) {
                    showResult('Login successful! Redirecting to dashboard...', true);
                    setTimeout(() => {
                        window.location.href = response.url;
                    }, 2000);
                } else {
                    const text = await response.text();
                    showResult('Login failed: ' + text, false);
                }
            } catch (error) {
                showResult('Network error: ' + error.message, false);
            }
        }
    </script>
</body>
</html>
